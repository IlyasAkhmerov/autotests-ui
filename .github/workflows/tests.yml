# Имя workflow, которое будет отображаться в интерфейсе GitHub Actions
name: UI tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  run-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # <-- ДОБАВЛЕНО: даём права на запись для деплоя

    steps:
      # 1. Клонируем репозиторий
      - name: Check out repository
        uses: actions/checkout@v7

      # 2. Устанавливаем Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 3. Устанавливаем зависимости
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps

      # 4. Запускаем тесты
      - name: Run Playwright tests with pytest and generate Allure results
        run: |
          pytest -m regression --alluredir=allure-results --numprocesses 2

      # 5. Проверяем, что результаты тестов создались (отладочный шаг)
      - name: Check allure-results
        run: |
          echo "Файлы в allure-results:"
          ls -la allure-results/ || echo "Папка allure-results не найдена!"

      # 6. Клонируем ветку gh-pages ТОЛЬКО если она существует
      - name: Get Allure history
        uses: actions/checkout@v7
        if: always()
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages
          # Добавляем fetch-depth: 1 чтобы не загружать всю историю
          fetch-depth: 1

      # 7. Создаём папку для истории, если её нет
      - name: Prepare history directory
        if: always()
        run: |
          mkdir -p allure-history
          # Если папка gh-pages пуста, создаём структуру вручную
          if [ -d "gh-pages" ] && [ "$(ls -A gh-pages 2>/dev/null)" ]; then
            echo "Найдена история в gh-pages"
            cp -r gh-pages/* allure-history/ 2>/dev/null || true
          else
            echo "Ветка gh-pages пуста или не существует, создаём новую историю"
            mkdir -p allure-history/last-history
          fi

      # 8. Генерируем Allure отчёт с историей
      - name: Generates Allure Report with history
        uses: simple-elf/allure-report-action@v1.13
        if: always()
        with:
          allure_results: allure-results
          allure_history: allure-history
          # Явно указываем, где сохранить отчёт
          allure_report: allure-report
          # Указываем ветку для истории
          gh_pages: gh-pages
          # Количество сохраняемых отчётов
          keep_reports: 20

      # 9. Проверяем, что отчёт сгенерировался
      - name: Check allure-report
        if: always()
        run: |
          echo "Файлы в allure-report:"
          ls -la allure-report/ || echo "Папка allure-report не найдена!"

      # 10. Деплоим на GitHub Pages
      - name: Deploy report to Github Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          # ВАЖНО: публикуем не allure-history, а allure-report!
          publish_dir: ./allure-report
          force_orphan: true
          # Чтобы не удалять историю при деплое
          keep_files: false